services:
  postgres:
    image: postgres:16-alpine
    container_name: patchproof-postgres
    restart: always
    environment:
      POSTGRES_USER: patchproof
      POSTGRES_PASSWORD: patchproof
      POSTGRES_DB: patchproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: patchproof-juice-shop
    restart: always
    ports:
      - "3001:3000"

volumes:
  postgres_data:
